name: tests

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
        working-directory: tools/lumma_go

  yara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y yara
      - name: Compile rules
        run: |
          for f in detections/*.yar; do
            yarac "$f" /tmp/compiled.bin && echo "$f ok"
          done
